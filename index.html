<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Vui Đọc Tiếng Việt 3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: sticker-book look. Lesson rail left, four tabs (Đọc bài, Chơi mà học, Nói về tranh, Phiếu khen) on the right; rail folds into a drawer on phones. */
:root{
  --bg:#e8f5ff; --paper:#ffffff; --ink:#1f2b45; --muted:#56658a;
  --brand:#2b6fe8; --brand-ink:#ffffff;
  --sun:#ffc533; --coral:#f2594b; --leaf:#22a863;
  --soft-brand:#d6e6ff; --soft-sun:#fff0bd; --soft-coral:#ffdcd7; --soft-leaf:#d1f3e1;
  --line:#c3dcf3; --rule:#bcd9f2; --margin:#ff9aa0; --hl:#fff0a6; --hl-word:#2b6fe8; --hl-word-ink:#ffffff;
  --sky-a:#bfe3ff; --sky-b:#eaf7ff; --grass:#8fdca6;
  --font-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a30; --paper:#1a2745; --ink:#eef3ff; --muted:#a9b8da;
    --brand:#7fb0ff; --brand-ink:#0b1630;
    --sun:#ffd25c; --coral:#ff8479; --leaf:#4fd68c;
    --soft-brand:#233a6b; --soft-sun:#4d4120; --soft-coral:#52282a; --soft-leaf:#1f4a37;
    --line:#2f4572; --rule:#34507c; --margin:#8a4a5a; --hl:#5b4d1b; --hl-word:#7fb0ff; --hl-word-ink:#0b1630;
    --sky-a:#1f3a68; --sky-b:#142548; --grass:#2f6b4a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a30; --paper:#1a2745; --ink:#eef3ff; --muted:#a9b8da;
  --brand:#7fb0ff; --brand-ink:#0b1630;
  --sun:#ffd25c; --coral:#ff8479; --leaf:#4fd68c;
  --soft-brand:#233a6b; --soft-sun:#4d4120; --soft-coral:#52282a; --soft-leaf:#1f4a37;
  --line:#2f4572; --rule:#34507c; --margin:#8a4a5a; --hl:#5b4d1b; --hl-word:#7fb0ff; --hl-word-ink:#0b1630;
  --sky-a:#1f3a68; --sky-b:#142548; --grass:#2f6b4a; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;
  padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15}
.emo{font-family:var(--font-emoji)}
/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mascot{flex:none;width:64px;height:64px}
.mascot svg{width:100%;height:100%;display:block}
h1{font-weight:800;font-size:clamp(1.7rem,5vw,2.5rem);color:var(--brand);text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 14px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.pill b{font-family:var(--font-display);font-size:1.3rem}
.pill .st{color:var(--sun);font-size:1.3rem;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.lvl{cursor:pointer;color:var(--leaf)}
/* buttons */
.btn{border:3px solid var(--brand);background:var(--paper);color:var(--brand);border-radius:999px;padding:6px 16px;font-weight:800;box-shadow:0 3px 0 var(--brand);transition:transform .08s}
.btn:hover{background:var(--soft-brand)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--brand)}
.btn.solid{background:var(--brand);color:var(--brand-ink)}
.btn.solid:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:flex;flex-wrap:wrap;border:3px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:800;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
/* voice box */
details.voicebox{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:8px 14px;margin-bottom:12px}
details.voicebox>summary{cursor:pointer;font-weight:800;color:var(--brand)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 18px;margin-top:10px;align-items:start}
.vrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.92rem;color:var(--muted);min-width:0}
.vrow select{max-width:100%;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg)}
.vrow input[type=range]{accent-color:var(--brand)}
.chk{display:inline-flex;gap:8px;align-items:center;font-weight:700}
.chk input{accent-color:var(--brand);width:18px;height:18px}
.notice{background:var(--soft-sun);border-radius:14px;padding:10px 14px;margin:8px 0 0;font-size:.92rem}
.tip{font-size:.9rem;color:var(--muted);margin:8px 0 0}
.tip li{margin:2px 0}
/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px}
.tab{flex:1 0 auto;border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:8px 16px;font-family:var(--font-display);font-weight:700;font-size:1.1rem;box-shadow:0 4px 0 var(--line);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--sun);border-color:var(--sun);color:#3a2a00;box-shadow:0 4px 0 #c99100}
:root[data-theme="dark"] .tab[aria-selected="true"]{box-shadow:0 4px 0 #8a6a10}
/* grid */
.grid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
details.rail{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px 12px;min-width:0;position:sticky;top:8px}
details.rail>summary{cursor:pointer;font-family:var(--font-display);font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-size:1rem}
.lessons{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow-y:auto;margin-top:10px;padding-right:2px}
details.grp{display:flex;flex-direction:column;gap:6px}
details.grp>summary{cursor:pointer;font-weight:800;font-size:.9rem;color:var(--muted);padding:4px 2px}
details.grp[open]>summary{margin-bottom:6px}
.lesson{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 10px;font-weight:700;min-width:0;width:100%}
.lesson .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft-brand);color:var(--brand);display:grid;place-items:center;font-family:var(--font-display);font-weight:800}
.lesson .t{min-width:0;overflow-wrap:anywhere;flex:1}
.lesson .ok{color:var(--leaf);font-weight:800}
.lesson[aria-current="true"]{border-color:var(--brand);background:var(--soft-brand)}
.lesson[aria-current="true"] .n{background:var(--brand);color:var(--brand-ink)}
.lesson.empty .t{color:var(--muted)}
details.add{margin-top:10px;border:2px dashed var(--line);border-radius:14px;padding:8px 12px}
details.add summary{cursor:pointer;font-weight:800;color:var(--brand)}
details.add form{display:flex;flex-direction:column;gap:8px;margin-top:10px}
details.add input,details.add textarea,.areaIn{border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);width:100%}
details.add textarea{min-height:120px;resize:vertical}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:14px 16px;min-width:0}
.card h2{font-size:1.25rem;color:var(--brand)}
.card p{margin:6px 0 10px;font-size:.93rem;color:var(--muted)}
/* book page */
.book{background:var(--paper);border:3px solid var(--line);border-radius:20px}
.book-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:14px 18px 10px 58px;border-bottom:3px solid var(--margin)}
.book-head h2{font-size:1.6rem;overflow-wrap:anywhere}
.tag{font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.orig{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:8px 18px 8px 58px;background:var(--soft-sun);font-size:.9rem}
.page{--lh:2.45rem;position:relative;padding:0 18px 10px 58px;font-size:1.3rem;line-height:var(--lh);
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 2px),var(--rule) calc(var(--lh) - 2px));background-size:100% var(--lh)}
.page::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--margin)}
.page p{margin:0}
.sent{border-radius:8px;padding:2px 0;transition:background .15s}
.sent.on{background:var(--hl)}
.sp{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;margin-right:.35rem;vertical-align:middle;border:0;border-radius:50%;background:var(--soft-brand);color:var(--brand);font-size:.7rem;padding:0;position:relative;top:-2px}
.sp:hover{background:var(--brand);color:var(--brand-ink)}
.w{border:0;background:transparent;padding:0 .08em;border-radius:6px;font:inherit;line-height:inherit;color:inherit}
.w:hover{background:var(--soft-brand)}
.w.on{background:var(--hl-word);color:var(--hl-word-ink)}
.emptybox{padding:16px 0 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;font-size:1rem}
.emptybox p{margin:0}
.emptybox textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.bar{position:sticky;bottom:0;z-index:5;background:var(--paper);border:3px solid var(--line);border-radius:20px;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.play{width:58px;height:58px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-size:1.4rem;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.play:active{transform:translateY(3px);box-shadow:none}
.speed{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:800;color:var(--muted)}
.speed input{accent-color:var(--brand);width:110px}
.status{flex:1 1 180px;min-width:0;font-size:.92rem;color:var(--muted)}
.wait{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.wait i{display:block;height:100%;width:0;background:var(--leaf)}
.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:3px 11px;font-weight:800}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.used{background:var(--leaf);border-color:var(--leaf);color:#fff}
.pair{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.pair b{font-family:var(--font-display);color:var(--brand);min-width:3.2rem}
audio{width:100%;margin-top:8px}
.file{display:block;margin-top:6px;font-size:.9rem;max-width:100%}
.bulkbox{margin:10px 0 4px;padding:10px 12px;border:2px dashed var(--line);border-radius:12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.recrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 0;border-top:2px solid var(--line)}
.recrow .tx{flex:1 1 240px;min-width:0;overflow-wrap:anywhere;font-size:.95rem}
.recst{font-size:.82rem;color:var(--muted)}
.recst.ok{color:var(--leaf)}
.recbtn{position:relative;padding:3px 12px;font-size:.9rem;display:inline-block}
.del{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:0;margin-left:auto}
/* speed / silent */
.spwrap{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:8px 0}
.sptime{font-family:var(--font-display);font-weight:800;font-size:1.8rem;color:var(--brand);min-width:5ch;font-variant-numeric:tabular-nums}
.gauge{position:relative;height:16px;border-radius:8px;background:var(--line);margin:22px 0 4px}
.gauge .zone{position:absolute;top:0;bottom:0;background:var(--soft-leaf);border:2px solid var(--leaf);border-radius:8px}
.gauge .mk{position:absolute;top:-8px;width:6px;height:32px;margin-left:-3px;border-radius:3px;background:var(--coral)}
.gaxis{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-weight:700}
.spout{margin-top:8px;font-weight:700}
.spout .big{font-family:var(--font-display);font-size:1.5rem;color:var(--brand)}
/* games */
.gpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid var(--line);border-radius:18px;padding:10px 6px;font-family:var(--font-display);font-weight:700;background:var(--soft-brand);box-shadow:0 4px 0 var(--line);line-height:1.2;text-align:center}
.gcard:nth-child(4n+2){background:var(--soft-sun)}
.gcard:nth-child(4n+3){background:var(--soft-leaf)}
.gcard:nth-child(4n+4){background:var(--soft-coral)}
.gcard .gi{font-size:2.2rem;font-family:var(--font-emoji);line-height:1.1}
.gcard[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 4px 0 var(--brand);transform:translateY(-2px)}
.stage{background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:14px 16px}
.ghead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
.score{font-weight:800;color:var(--muted);font-size:.92rem}
.gprompt{font-family:var(--font-display);font-weight:700;font-size:1.25rem;margin:6px 0 10px}
.picgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:6px 0}
.pic{aspect-ratio:1;border:3px solid var(--line);border-radius:24px;background:var(--soft-brand);font-family:var(--font-emoji);font-size:clamp(3rem,13vw,4.8rem);line-height:1;display:grid;place-items:center;box-shadow:0 5px 0 var(--line);max-width:100%;padding:0;transition:transform .1s}
.pic:nth-child(4n+2){background:var(--soft-sun)}
.pic:nth-child(4n+3){background:var(--soft-leaf)}
.pic:nth-child(4n+4){background:var(--soft-coral)}
.pic:hover:not(:disabled){transform:translateY(-3px) rotate(-1deg)}
.pic.good{border-color:var(--leaf);box-shadow:0 5px 0 var(--leaf);animation:pop .5s}
.pic.bad{opacity:.45}
.bigpic{display:grid;place-items:center;width:min(190px,60vw);aspect-ratio:1;margin:4px auto 8px;border-radius:30px;background:var(--soft-sun);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);font-family:var(--font-emoji);font-size:clamp(4rem,20vw,6.5rem);line-height:1}
.blankword{font-family:var(--font-display);font-weight:800;font-size:2.4rem;text-align:center;letter-spacing:.05em}
.blank{display:inline-block;min-width:2.8ch;border-bottom:5px solid var(--coral);color:var(--coral);text-align:center}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0}
.opt{border:3px solid var(--line);background:var(--bg);border-radius:16px;padding:10px 18px;font-family:var(--font-display);font-weight:800;font-size:1.5rem;box-shadow:0 4px 0 var(--line);min-width:90px;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.good{background:var(--leaf);border-color:var(--leaf);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.opt.bad{opacity:.5;text-decoration:line-through}
.slots,.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:3.4rem;padding:10px;border-radius:16px;justify-content:center}
.slots{border:3px dashed var(--brand);background:var(--soft-brand);margin:8px 0}
.slots.right{border-style:solid;border-color:var(--leaf);background:var(--soft-leaf)}
.bank{background:var(--bg)}
.tile{border:3px solid var(--line);background:var(--paper);border-radius:12px;padding:3px 14px;font-weight:800;font-size:1.25rem;font-family:var(--font-display);box-shadow:0 3px 0 var(--line)}
.tile:hover{border-color:var(--brand)}
.fillline{font-size:1.3rem;line-height:2.2;margin:8px 0;text-align:center}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0}
.mc{aspect-ratio:1;border-radius:18px;border:3px solid var(--brand);background:repeating-linear-gradient(45deg,var(--brand) 0 10px,var(--soft-brand) 10px 20px);color:var(--ink);padding:2px;font-family:var(--font-emoji);font-size:clamp(1.8rem,8vw,3.4rem);line-height:1;display:grid;place-items:center;box-shadow:0 4px 0 var(--brand);overflow:hidden}
.mc.up{background:var(--paper);border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.mc.wd{font-family:var(--font-display);font-weight:800;font-size:clamp(.95rem,3.6vw,1.45rem);overflow-wrap:anywhere;text-align:center;color:var(--ink)}
.mc.done{background:var(--soft-leaf);border-color:var(--leaf);box-shadow:0 4px 0 var(--leaf);animation:pop .5s}
.dict{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.dict textarea{min-height:90px;font-size:1.2rem;resize:vertical}
.dres{font-size:1.2rem;line-height:2;text-align:center}
.dres .okw{color:var(--leaf);font-weight:800}
.dres .nw{color:var(--coral);font-weight:800;text-decoration:underline wavy}
.grow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.gmsg{font-weight:800;color:var(--leaf)}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
/* talk */
.scene{position:relative;height:clamp(190px,42vw,270px);border-radius:22px;border:3px solid var(--line);overflow:hidden;background:linear-gradient(var(--sky-a),var(--sky-b) 62%,var(--grass) 62%)}
.scene span{position:absolute;font-family:var(--font-emoji);line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.qcard{background:var(--soft-sun);border-radius:18px;padding:12px 16px;margin:8px 0;font-size:1.1rem;font-weight:700}
.qtag{display:inline-block;font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:1px 10px;margin-bottom:4px}
.role{font-family:var(--font-display);font-weight:800;color:var(--coral)}
/* report */
.rgrid{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:center}
.plant svg{width:100%;height:auto;display:block;max-width:200px;margin:0 auto}
.pbar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin:6px 0}
.pbar i{display:block;height:100%;background:var(--leaf);border-radius:7px;transition:width .4s}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.badge{display:flex;gap:12px;align-items:flex-start;border:3px solid var(--line);border-radius:18px;padding:10px 12px;background:var(--bg);min-width:0}
.badge .bi{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;font-family:var(--font-emoji);background:var(--line);filter:grayscale(1);opacity:.7}
.badge.got{background:var(--soft-leaf);border-color:var(--leaf)}
.badge.got .bi{background:var(--sun);filter:none;opacity:1}
.badge h3{font-size:1.05rem}
.badge p{margin:2px 0 4px;font-size:.9rem;color:var(--ink)}

var DEFAULT_LIST=[
"Hết hè, lớp em gặp lại nhau trong sân trường. Bạn nào cũng cao lên và rám nắng. Lan khoe chiếc cặp mới, Nam kể chuyện về quê ngoại.\nTiếng cười nói rộn ràng cả buổi sáng.",
"Cuối tuần, cả nhà em về thăm quê nội. Xe chạy qua cánh đồng lúa xanh mướt.\nÔng bà đứng chờ ở đầu ngõ, nụ cười thật hiền. Bữa cơm quê có rau vườn và cá ao, ăn rất ngon.",
"Nắng sớm xuyên qua tán lá, rải vàng xuống mặt đất. Chim hót líu lo trên những cành cao.\nEm đi theo lối mòn, nghe tiếng suối róc rách phía xa. Cánh rừng buổi sáng thật yên bình.",
"Lần đầu ra biển, em đứng ngẩn ngơ trước làn nước xanh rộng mênh mông. Sóng vỗ vào bờ rì rào.\nChân em chạm cát mịn, mát lạnh. Bố nắm tay em bước xuống nước, em vừa sợ vừa thích.",
"Thứ Bảy. Hôm nay em tập bơi ở bể gần nhà. Lúc đầu em sợ chìm, cứ bám chặt thành bể.\nCô huấn luyện bảo em thở đều và đạp chân nhẹ nhàng. Cuối buổi, em bơi được năm mét. Em vui lắm!",
"Hôm nay mẹ dạy em nấu món trứng chiên. Em đập trứng vào bát, thêm chút muối rồi đánh đều.\nMẹ đổ dầu vào chảo nóng, em nhẹ tay đổ trứng vào. Miếng trứng vàng ươm thơm phức. Cả nhà khen em khéo tay.",
"Mùa hè về, nắng vàng lấp lánh trên mặt hồ. Hoa phượng đỏ rực cả góc sân. Tiếng ve kêu râm ran trên cây.\nChúng em rủ nhau đi bắt chuồn chuồn, thả diều ngoài đồng.",
"Kì nghỉ hè sắp hết. Em xếp lại sách vở, dán nhãn cho quyển vở mới.\nEm nhớ những buổi chiều thả diều và những chuyến đi chơi xa. Tạm biệt mùa hè, em sẽ đến trường với niềm vui mới.",
"Sáng nào em cũng thức dậy sớm để đến trường. Ở lớp, cô giáo dạy em đọc, viết và làm toán.\nGiờ ra chơi, em chơi nhảy dây cùng các bạn. Được đi học, em thấy thật vui.",
"Con đường đến trường của em quanh co giữa hai hàng cây. Mùa mưa, đường trơn nhưng em và các bạn vẫn đi cùng nhau.\nBác bảo vệ chào em mỗi sáng. Con đường ấy quen thuộc và thân thương.",
"Cô ra một bài toán khó, cả lớp lúng túng. Minh ngồi nghĩ rất lâu rồi giơ tay xin trả lời.\nCậu vẽ hình lên bảng và giải thích từng bước. Cô mỉm cười khen: “Lời giải của em rất sáng tạo!” Cả lớp vỗ tay.",
"Cô giao đề bài: Tả người thân của em. Em ngồi nghĩ mãi mà chưa biết viết gì.\nEm nhớ đến bà với mái tóc bạc và đôi bàn tay chai sần. Em viết một mạch, từng dòng chữ đầy yêu thương.",
"Bàn tay cô giáo cầm viên phấn, viết những dòng chữ đẹp lên bảng. Bàn tay cô nắm tay em tập viết từng nét.\nCó lúc, bàn tay ấy xoa đầu khi em làm đúng. Em nhớ mãi bàn tay dịu dàng của cô.",
"Trong quyển vở, các chữ cái họp bàn với nhau. Chữ a nói rằng thiếu dấu thì đọc sẽ sai.\nDấu chấm tự hào vì giữ cho câu văn khỏi dài lê thê. Cuối cùng, ai cũng hiểu mỗi chữ, mỗi dấu đều quan trọng.",
"Thư viện trường em có nhiều giá sách ngay ngắn. Em nhẹ chân bước vào, chọn một quyển truyện tranh.\nEm ngồi đọc ở góc bàn gần cửa sổ. Đọc xong, em đặt sách về chỗ cũ để bạn khác cùng đọc.",
"Hôm nay là ngày em được kết nạp vào Đội. Em đứng nghiêm trang giữa sân trường.\nAnh chị lớp trên thắt khăn quàng đỏ lên cổ em. Em tự hào và hứa sẽ cố gắng học tập tốt.",
"Ngưỡng cửa nhà em đã quen đón bước chân của cả nhà. Bà ngồi đó mỗi chiều chờ em đi học về.\nEm tập đi những bước đầu tiên cũng từ ngưỡng cửa ấy. Với em, đó là nơi bắt đầu mọi con đường.",
"Sinh nhật mẹ, em muốn tặng mẹ một món quà. Em không có nhiều tiền nên tự làm một tấm thiệp.\nEm vẽ bông hoa và viết: Con yêu mẹ. Mẹ ôm em thật chặt, nói đó là món quà đặc biệt nhất.",
"Có một ngôi nhà nhỏ xíu, bé như đồ chơi. Cả nhà ngồi sát bên nhau nên ấm áp lạ lùng.\nBố kể chuyện, mẹ khâu áo, em ôm gấu bông. Nhà tuy bé nhưng tình thương thì rất lớn.",
"Tối nào em cũng kể cho mẹ nghe chuyện ở lớp. Mẹ lắng nghe, thỉnh thoảng gật đầu mỉm cười.\nCó hôm em buồn vì bị điểm thấp, mẹ ôm em và dặn lần sau cố gắng hơn. Trò chuyện với mẹ, lòng em nhẹ nhõm.",
"Một tia nắng bé nhỏ lọt qua khe cửa sổ. Tia nắng nhảy trên bàn học, đậu lên quyển vở của em.\nEm đưa tay đón, thấy ấm áp. Có lẽ tia nắng đến chào em buổi sáng.",
"Ông đã già, bước chân chậm rãi. Chiều nào, cháu cũng nắm tay ông đi dạo quanh vườn.\nCháu kể ông nghe chuyện ở trường, ông kể cháu nghe chuyện ngày xưa. Bàn tay ông gầy nhưng ấm lắm.",
"Em tôi mới lên ba, đôi má hồng và nụ cười tươi. Em hay bắt chước tôi đọc sách.\nCó hôm em làm đổ mực, tôi hơi bực nhưng nhìn mắt em ngơ ngác là quên ngay. Tôi yêu em tôi lắm.",
"Chú chó nhỏ nhà em tên là Bông. Sáng nào Bông cũng chạy ra cổng đón em.\nEm cho Bông ăn và dắt Bông đi dạo. Bông là người bạn nhỏ trung thành trong nhà em.",
"Con đường lên núi có những bậc đá dài tưởng như chạm tới mây. Người dân nơi đây đã đẽo từng bậc đá suốt nhiều năm.\nNhờ vậy, các em nhỏ đến trường dễ dàng hơn. Mỗi bậc đá là một câu chuyện về sự kiên trì.",
"Trời mưa dầm nhiều ngày, bạn gà con muốn đi tìm mặt trời. Gà con hỏi mây, hỏi gió nhưng ai cũng bảo chưa biết.\nCuối cùng, mưa tạnh, mặt trời hiện ra rực rỡ. Gà con reo lên vì đã gặp bạn.",
"Mùa đông đến, gió lạnh thổi buốt. Cô giáo và các bạn quyên góp những chiếc áo ấm cho trẻ em vùng cao.\nChiếc áo nào cũng được gấp gọn gàng. Mặc áo ấm, các bạn nhỏ cười tươi hơn.",
"Bé có một con đường nhỏ đi từ nhà ra chợ. Sáng nào đường cũng rộn tiếng chào hỏi.\nBác bán rau, cô bán bánh đều nhận ra bé. Con đường tuy nhỏ nhưng đầy tình làng nghĩa xóm.",
"Dưới đám cỏ xanh có một ngôi nhà bé xíu của bác dế. Khi trời mưa, các bạn bọ rùa, kiến nhỏ chạy vào trú.\nNgôi nhà chật mà ai cũng vui. Nhờ biết chia sẻ, ngôi nhà trong cỏ luôn ấm cúng.",
"Ngoài khơi xa có những ngọn hải đăng sáng đèn suốt đêm. Ánh sáng ấy giúp tàu thuyền tìm được lối về bến.\nNhững người gác đèn sống lặng lẽ trên đảo. Nhờ họ, những chuyến ra khơi được bình yên.",
"Ông Tư làm đồ chơi bằng tre và giấy màu. Đôi tay ông khéo léo làm ra con trâu, chiếc kèn, ngôi sao.\nTrẻ con trong xóm thích ghé xem ông làm. Ông bảo mỗi món đồ chơi mang theo niềm vui của người làm ra.",
"Ngày xưa có một cậu bé nghèo thích vẽ. Một đêm, ông tiên cho cậu một cây bút thần.\nCậu vẽ gì thì vật ấy hiện ra thật. Cậu chỉ dùng cây bút để giúp những người nghèo khó.",
"Bầu trời buổi sáng xanh trong, vài đám mây trắng trôi chầm chậm. Buổi trưa, trời cao và nắng gắt.\nChiều xuống, trời nhuộm màu cam rồi tím nhạt. Bầu trời mỗi lúc một vẻ.",
"Mây đen kéo đến, gió nổi lên. Những hạt mưa đầu tiên rơi lộp độp trên mái nhà.\nCây cối tươi tỉnh, mặt đường loang loáng nước. Mưa tạnh, cầu vồng hiện ra bảy sắc.",
"Ngày xưa, trời hạn hán lâu ngày, muôn loài khô khát. Cóc quyết lên thiên đình kiện trời.\nTrên đường đi, cóc rủ thêm nhiều bạn cùng đi. Nhờ đoàn kết, họ khiến Trời phải cho mưa xuống.",
"Cả nhà em hay gọi nhau bằng những cái tên ở nhà. Em là Bống, em trai là Cu Tí.\nBa mẹ nói tên gọi ấy chứa đầy tình thương. Em thấy mỗi cái tên đều thật đáng yêu.",
"Hôm nay, rừng xanh mở hội. Các loài chim hát vang trên cành cao.\nSóc nhảy múa, gấu nhỏ thổi kèn. Cả rừng rộn ràng tiếng cười.",
"Đầu xuân, cây gạo ở đầu làng nở hoa đỏ rực. Từng bông hoa to như chiếc chén.\nChim chóc kéo đến hót vang. Cây gạo trông như ngọn đuốc lớn giữa trời xanh.",
"Bạn nhỏ vẽ một mặt trời màu xanh. Cô giáo hỏi vì sao, bạn đáp: “Con thích màu xanh của cây lá.”\nCô mỉm cười và treo tranh lên tường. Với bạn ấy, mặt trời xanh là mặt trời mát lành.",
"Trên dãy Trường Sơn, từng bầy voi rừng đi kiếm ăn. Voi mẹ đi trước, voi con theo sau, nối đuôi nhau.\nChúng uống nước suối và tắm mát dưới khe. Chúng ta cần bảo vệ rừng để loài voi sống yên ổn.",
"Muốn có sức khỏe tốt, mỗi người cần tập thể dục hằng ngày. Tập thể dục giúp cơ thể dẻo dai và tinh thần vui vẻ.\nChỉ cần dành mười phút mỗi sáng là đủ. Chúng ta hãy cùng nhau rèn luyện thân thể.",
"Thỏ con hái được một quả hồng chín. Nó định ăn ngay nhưng nhớ ra bà thỏ đang ốm.\nThỏ con mang quả hồng sang biếu bà. Bà ăn xong, ôm cháu và cảm ơn thật nhiều.",
"Bên cửa sổ lớp học có một cây phượng nhỏ. Giờ nghỉ, hai bạn Lan và Hà ngồi trò chuyện.\nHai bạn kể cho nhau nghe ước mơ của mình. Từ hôm đó, hai bạn trở thành đôi bạn thân.",
"Tay trái và tay phải cãi nhau xem tay nào giỏi hơn. Tay phải khoe mình biết viết, tay trái khoe mình giữ vở.\nBỗng bạn nhỏ cần xách vật nặng, phải dùng cả hai tay. Hai tay hiểu rằng làm việc cùng nhau mới tốt.",
"Mèo con ngồi bên bờ ao, tay cầm cần câu. Lúc đầu mèo nóng vội nên cá sợ chạy mất.\nSau đó mèo ngồi yên, kiên nhẫn chờ đợi. Cuối cùng, một chú cá to cắn câu. Mèo hiểu rằng muốn câu được cá phải biết kiên nhẫn.",
"Bé Na muốn học nghề làm bánh của bà. Bà dạy Na nhào bột, nặn bánh từng chút một.\nBánh đầu tiên của Na méo mó. Bà bảo cứ làm nhiều lần sẽ đẹp thôi. Na kiên trì và dần làm được những chiếc bánh xinh.",
"Thỏ hỏi các bạn: “Ngày như thế nào là đẹp?” Gà trống nói ngày có nắng ấm. Ếch bảo ngày có mưa rào.\nCuối cùng, các bạn cùng nhận ra ngày đẹp là ngày được ở bên bạn bè.",
"Bé Mai chơi trò gọi điện bằng chiếc điện thoại đồ chơi. Mai nhấc máy: “A lô, tớ đây!”\nBạn Bi ở nhà bên cũng nghe máy, hai bạn nói chuyện rôm rả. Họ cười khúc khích suốt buổi chiều.",
"Đất nước là gì? Đó là dòng sông, ngọn núi, cánh đồng. Đó là những người thân yêu quanh ta.\nĐất nước là tiếng mẹ đẻ ta nói mỗi ngày. Em yêu đất nước Việt Nam của em.",
"Quê tôi có ngọn núi xanh sừng sững giữa trời. Sáng sớm, mây trắng quấn quanh sườn núi.\nNgười dân lên núi hái chè, trồng cây. Dù đi xa, tôi vẫn nhớ ngọn núi quê mình.",
"Sông Hương chảy chậm qua thành phố Huế. Nước sông xanh biếc, soi bóng những hàng cây.\nTrên sông có những chiếc thuyền chầm chậm trôi. Ai đến Huế cũng muốn ngồi thuyền nghe hò.",
"Tiếng Việt có sáu thanh điệu nên nghe như một bài hát. Mẹ ru em bằng những câu ca dao ngọt ngào.\nCô dạy em đọc đúng, viết đúng từng chữ. Em yêu tiếng nước mình.",
"Ở Tây Nguyên, mỗi buôn làng có một ngôi nhà rông. Mái nhà rông cao vút như lưỡi rìu khổng lồ.\nDân làng họp bàn việc chung và mở hội ở đây. Nhà rông là nơi gắn bó của cả buôn.",
"Ngày xưa, có hai ông bà khổng lồ là ông Đùng và bà Đùng. Hai người đào sông, đắp núi, giúp muôn dân.\nNhờ tay hai ông bà, đất đai thêm màu mỡ. Nhân dân nhớ ơn và kể lại câu chuyện này.",
"Hơn một nghìn chín trăm năm trước, đất nước ta bị quân phương Bắc đô hộ. Hai Bà Trưng là Trưng Trắc và Trưng Nhị đã đứng lên khởi nghĩa.\nNhân dân khắp nơi hưởng ứng, đánh đuổi quân xâm lược. Ngày nay, chúng ta luôn nhớ ơn hai bà.",
"Trời mưa, nước suối dâng cao chảy xiết. Đoàn người cùng nhau lội qua.\nMọi người nắm tay nhau, cẩn thận bước từng bước. Qua được suối, ai cũng thấy vui và ấm lòng.",
"Thế vận hội Ô-lim-pích bắt đầu từ nước Hy Lạp cổ đại. Trước lễ khai mạc, ngọn đuốc được thắp sáng và rước đi nhiều nơi.\nNgọn lửa tượng trưng cho tinh thần đoàn kết và tình hữu nghị. Các vận động viên cùng tranh tài công bằng.",
"Rô-bốt là những cỗ máy do con người tạo ra. Có rô-bốt giúp quét nhà, có rô-bốt giúp lắp ráp ở nhà máy.\nCó rô-bốt còn được dùng trong y tế. Rô-bốt giúp cuộc sống thuận tiện hơn.",
"Chào các bạn nhỏ, tôi là ông Trái Đất. Tôi đã sống cùng loài người rất lâu.\nCác bạn hãy giữ gìn xanh sạch quanh nhà, đừng vứt rác bừa bãi. Có như vậy, tôi mới khỏe mạnh để che chở cho các bạn.",
"Tớ tắt đèn khi ra khỏi phòng. Tớ dùng túi vải thay túi nhựa khi đi chợ cùng mẹ.\nTớ nhặt rác ở sân trường bỏ vào thùng. Những việc nhỏ ấy giúp Trái Đất xanh hơn.",
"Y-éc-xanh là một nhà khoa học đã đến sống và làm việc ở Việt Nam. Ông tận tụy chữa bệnh và nghiên cứu để giúp người dân.\nÔng trồng nhiều loại cây và yêu mến mảnh đất này. Người Việt Nam luôn kính trọng và biết ơn ông.",
"Trái Đất là mái nhà chung của muôn loài. Người, chim muông, cây cỏ đều sống dưới bầu trời xanh.\nMỗi chúng ta đều phải bảo vệ ngôi nhà ấy. Hãy cùng nhau giữ cho Trái Đất mãi tươi đẹp."

var AU=(function(){

    if(u.blob){rev=URL.createObjectURL(u.blob);src=rev}else if(u.url)src=u.url;else src="data:audio/mpeg;base64,"+CL[nk(u.text)].d;

    function end(v){if(fin)return;fin=true;a.onended=null;a.onerror=null;a.ontimeupdate=null;if(rev)URL.revokeObjectURL(rev);res(v)}

    }
    a.onended=function(){end("ended")};a.onerror=function(){end("error")};
    if(u.onTime)a.ontimeupdate=function(){u.onTime(a)};
    if(u.from){a.addEventListener("loadedmetadata",function(){try{a.currentTime=u.from}catch(e){}},{once:true})}
    a.src=src;
    var pr=u.rate||ST.clipRate||0.85;try{a.defaultPlaybackRate=pr;a.playbackRate=pr;a.preservesPitch=true;a.mozPreservesPitch=true;a.webkitPreservesPitch=true}catch(e){}
    if(!p)go();
    return {done:done,pause:function(){if(fin||p)return;p=true;try{a.pause()}catch(e){}},resume:function(){if(fin||!p)return;p=false;go()},cancel:function(){if(fin)return;try{a.pause()}catch(e){}end("cancel")},audio:a};
  }
  function mkTTS(u,paused){
    var res,fin=false,p=!!paused,id=0,done=new Promise(function(r){res=r});
    function end(v){if(fin)return;fin=true;res(v)}
    function speak(){
      var my=++id,ut;

      ut.lang="vi-VN";if(voice)ut.voice=voice;ut.rate=u.rate||ST.rate;ut.pitch=u.pitch||ST.pitch;
      if(u.onBoundary)ut.onboundary=function(ev){if(my===id)u.onBoundary(ev)};

  }
  function mkWait(ms,paused){

function tokenize(w){
  var s=w.normalize("NFC").toLowerCase(),out=[],i=0;
  var di=["ngh","ng","nh","ch","tr","th","ph","kh","gh","gi","qu"];
  while(i<s.length){var m=null;for(var j=0;j<di.length;j++)if(s.substr(i,di[j].length)===di[j]){m=di[j];break}
    if(m){out.push(m);i+=m.length}else{out.push(s[i]);i++}}
  return out;
}

function altSpellings(w){

  return out;
}

/* ----- sửa câu: CHỈ sửa những lỗi chắc chắn (thiếu dấu thanh, viết hoa đầu câu, dấu câu, khoảng trắng).
   Không đoán từ gần giống, không kiểm tra ngữ pháp. ----- */
function stripD(x){return String(x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase()}
var LEXC=null,KNOWNW=null;
function lexicon(){
  if(LEXC)return LEXC;LEXC={};KNOWNW={};
  var src=allLessons().map(function(l){return l.text}).concat(SC.map(function(s){return s.s+" "+s.w.join(" ")+" "+s.tq.join(" ")+" "+s.pq.join(" ")}),VI.map(function(v){return v.w}),PAIR_GROUPS.map(function(g){return g.words.join(" ")}));
  src.forEach(function(t){wordsOf(t).forEach(function(w){var lw=w.toLowerCase();KNOWNW[lw]=1;var k=stripD(lw);var a=LEXC[k]||(LEXC[k]=[]);if(a.indexOf(lw)<0)a.push(lw)})});
  return LEXC;
}
function resetLexicon(){LEXC=null;KNOWNW=null}
function correctSentence(raw){
  var text=String(raw).normalize("NFC").replace(/\s+/g," ").trim();var notes=[];var before=text;
  var lx=lexicon();
  var toks=text.split(" ");
  var ph={};VI.map(function(v){return v.w}).concat.apply(VI.map(function(v){return v.w}),SC.map(function(s){return s.w})).forEach(function(w){if(w.indexOf(" ")>0)ph[stripD(w)]=w});
  for(var j=0;j+1<toks.length;j++){
    var a1=toks[j].replace(/^[“"(]+|[.,;:!?…”")]+$/g,""),a2=toks[j+1].replace(/^[“"(]+|[.,;:!?…”")]+$/g,"");
    var key=stripD(a1+" "+a2),w2=ph[key];
    if(w2&&(a1+" "+a2).toLowerCase()!==w2){var pre=toks[j].match(/^[“"(]+/),post=toks[j+1].match(/[.,;:!?…”")]+$/);
      notes.push("“"+a1+" "+a2+"” viết đúng là “"+w2+"”.");toks.splice(j,2,(pre?pre[0]:"")+w2+(post?post[0]:""))}
  }
  for(var i=0;i<toks.length;i++){
    var core=toks[i].replace(/^[“"(]+|[.,;:!?…”")]+$/g,"");if(!core)continue;
    var low=core.toLowerCase();
    if(KNOWNW[low])continue;                       // từ đã đúng, không đụng vào
    var k=stripD(low);var cand=lx[k];
    if(cand&&cand.length===1){                      // chỉ sửa khi có đúng MỘT cách viết có dấu trong kho từ
      var fixed=core[0]===core[0].toUpperCase()&&core[0]!==core[0].toLowerCase()?cand[0][0].toUpperCase()+cand[0].slice(1):cand[0];
      var pre=toks[i].match(/^[“"(]+/),post=toks[i].match(/[.,;:!?…”")]+$/);
      toks[i]=(pre?pre[0]:"")+fixed+(post?post[0]:"");notes.push("“"+core+"” viết đúng là “"+fixed+"”.");
    }
  }
  text=toks.join(" ").replace(/\s+([.,;:!?…])/g,"$1");
  if(text&&text[0]!==text[0].toUpperCase()){text=text[0].toUpperCase()+text.slice(1);notes.push("Chữ đầu câu cần viết hoa.")}
  if(text&&!/[.!?…]$/.test(text)){text+=".";notes.push("Cuối câu cần có dấu chấm.")}
  return {text:text,changed:text!==before,notes:notes};
}

function importData(txt){
  var d;try{d=JSON.parse(txt)}catch(e){return "Tệp không đọc được. Cô chọn đúng tệp sao lưu của app nhé."}
  if(!d||typeof d!=="object"||d.app!=="vui-doc-tv3")return "Đây không phải tệp sao lưu của “Vui Đọc Tiếng Việt 3”. Dữ liệu hiện tại được giữ nguyên.";
  if(typeof d.v!=="number"||d.v>1)return "Tệp sao lưu có phiên bản mới hơn app này. Dữ liệu hiện tại được giữ nguyên.";
  var plain=function(x){return x&&typeof x==="object"&&!Array.isArray(x)};
  if(d.ph!==undefined&&!(plain(d.ph)&&plain(d.ph.edit)&&plain(d.ph.del)&&Array.isArray(d.ph.add)))return "Phần lời cô giáo trong tệp bị sai định dạng. Dữ liệu hiện tại được giữ nguyên.";
  if(d.les!==undefined&&!(plain(d.les)&&plain(d.les.edit)&&Array.isArray(d.les.add)&&plain(d.les.del)))return "Phần bài đọc trong tệp bị sai định dạng. Dữ liệu hiện tại được giữ nguyên.";
  if(d.cv!==undefined&&!Array.isArray(d.cv))return "Phần từ vựng trong tệp bị sai định dạng. Dữ liệu hiện tại được giữ nguyên.";
  if(d.pr!==undefined&&!(plain(d.pr)&&Array.isArray(d.pr.list)&&d.pr.list.length&&d.pr.list.every(function(p){return p&&typeof p.id==="string"&&typeof p.name==="string"})))return "Phần hồ sơ trong tệp bị sai định dạng. Dữ liệu hiện tại được giữ nguyên.";
  if(d.prog!==undefined&&!plain(d.prog))return "Phần tiến độ trong tệp bị sai định dạng. Dữ liệu hiện tại được giữ nguyên.";
  if(d.ph){PHS=d.ph;if(!Array.isArray(PHS.add))PHS.add=[];phSave()}
  if(d.les){LS=d.les;if(!plain(LS.del))LS.del={};lesSave()}
  if(d.cv){lsSet("dtv3c-cv",d.cv.filter(function(x){return x&&typeof x.w==="string"&&typeof x.e==="string"&&VCATS.some(function(c){return c.id===x.cat})}));VI.length=VIBASE.length;lsGet("dtv3c-cv",[]).forEach(function(x){VI.push({w:x.w,e:x.e,cat:x.cat,custom:true})});rebuildKnown()}
  if(plain(d.set)){Object.keys(d.set).forEach(function(k){if(typeof d.set[k]===typeof ST[k])ST[k]=d.set[k]});stSave()}
  if(d.pr){PR=d.pr;prSave()}
  if(d.prog)Object.keys(d.prog).forEach(function(id){if(plain(d.prog[id]))lsSet(pKey(id),d.prog[id])});
  if(plain(d.clipBad)){BAD=d.clipBad;lsSet("dtv3b-clipbad",BAD)}if(plain(d.clipOk)){OKD=d.clipOk;lsSet("dtv3b-clipok",OKD)}
  if(!PR.list.some(function(p){return p.id===PR.cur}))PR.cur=PR.list[0].id;
  prSave();P=loadP();uiHud();
  return "";
}

var EXS={san:["Các bạn nhỏ","chơi nhảy dây ở sân trường"],vuon:["Những chú ong","bay quanh bông hoa"],mua:["Em","che ô đi học dưới trời mưa"],bien:["Các bạn nhỏ","chơi cát trên bãi biển"],bep:["Em","giúp mẹ rửa rau"],thuvien:["Bạn nhỏ","ngồi đọc sách ở thư viện"],cho:["Mẹ và em","đi mua rau ở chợ"],trai:["Bác nông dân","chăm sóc đàn bò"]};
var SUBJ_START=["các em","các bạn","bạn nhỏ","bạn","cô giáo","thầy giáo","em","bé","mẹ","bố","ba","ông","bà","anh","chị","chú","bác","cô","thầy","những","các","mọi người","cả nhà","lớp em","học sinh","hai bạn","con","chiếc","cái"];

var PLACES=["sân trường","thư viện","bãi biển","biển","khu vườn","vườn","chợ quê","chợ","nhà bếp","bếp","trang trại","lớp học","trường","đồng lúa","sân","bờ biển","trong vườn"];
function startsWithAny(txt,list){var t=nk(txt),best=null;list.forEach(function(w){if((t===w||t.indexOf(w+" ")===0)&&(!best||w.length>best.length))best=w});return best}
function capFirst(s){s=String(s).trim();return s?s[0].toUpperCase()+s.slice(1):s}
function analyzeFrame(T){
  T=String(T||"").trim();
  if(!T)return {ok:false,msg:"Em nói hoặc viết câu của em vào ô trước nhé."};
  var v=startsWithAny(T,VERB_START),sj=startsWithAny(T,SUBJ_START),pl=startsWithAny(T,PLACES);
  if(v&&!sj)return {ok:false,msg:"Câu của em bắt đầu bằng “"+v+"”. Em nói người hoặc con vật làm việc ấy trước, rồi mới nói việc làm. Ví dụ: “Các bạn "+T.charAt(0).toLowerCase()+T.slice(1).replace(/[.!?]+$/,"")+".”"};
  if(pl&&!sj&&!v)return {ok:false,msg:"Câu của em bắt đầu bằng nơi chốn “"+pl+"”. Em nói người hoặc con vật trước, rồi việc làm, và để nơi chốn ở cuối câu."};
  if(!sj&&!/\s/.test(T)&&!lexicon()[stripD(T)])return {ok:true,warn:true};
  return {ok:true};
}
function answerFrame(d,s,key){
  var ar=el("div","pgrp");var ti=el("input");
  ti.type="text";ti.className="search";ti.style.flex="1 1 260px";ti.autocomplete="off";
  ti.placeholder="Em nói câu của em…";ti.setAttribute("aria-label","Câu trả lời của em");
  var chips=el("div","pgrp");
  s.w.forEach(function(w){chips.appendChild(btn(w,"small",function(){ti.value=(ti.value?ti.value+" ":"")+w;ti.focus()}))});
  var fb=el("p","lead","");fb.setAttribute("aria-live","polite");fb.style.fontWeight="700";
  ar.appendChild(ti);
  var send=btn("Gửi","big",function(){
    var r=analyzeFrame(ti.value);
    if(!r.ok){fb.textContent=r.msg;return}
    var sentence=capFirst(ti.value.trim().replace(/[.!?]+$/,""))+"."; var cr=correctSentence(sentence);
    var t=nk(cr.text);var hit=s.w.filter(function(w){return t.indexOf(nk(w))>=0});
    var msg="Câu của em: “"+cr.text+"” ";
    if(cr.changed&&cr.notes.length&&cr.notes.some(function(x){return /viết đúng là/.test(x)}))msg+="Cô sửa cách viết: "+cr.notes.filter(function(x){return /viết đúng là/.test(x)}).join(" ")+" ";
    if(r.warn)msg+="Em thử nói thêm cho đủ ý nhé. ";
    msg+="Cô giáo sẽ xem lại cách dùng từ và ngữ pháp. ";
    if(hit.length){add(key);stat("talk",true);msg+="Em đã dùng từ “"+hit[0]+"” trong chủ đề. ";addStars(1);praise(phText("n1"),false,phText("n1"))}
    else msg+="Em thử dùng một từ gợi ý ("+s.w.slice(0,3).join(", ")+"). ";
    log("nói","Câu của em ("+s.n+"): "+cr.text);fb.textContent=msg;
  });
  ar.appendChild(send);
  ar.appendChild(btn("Em đã trả lời miệng","small",function(){add(key);fb.textContent=pick(praisePool())}));
  d.appendChild(chips);d.appendChild(ar);d.appendChild(fb);
}
